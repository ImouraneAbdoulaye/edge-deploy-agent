[project]
name = "edge-deploy-agent"
version = "0.1.0"
description = "An LLM agent that finds how to deploy a neural network on a microcontroller under flash, RAM and accuracy constraints."
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
    "tensorflow==2.19.0",
    "torch",
    "qualia-codegen-core==2.6.0",
    "tabulate",
    "langgraph",
    "langchain-core",
    "langchain-ollama",
    "langchain-groq",
    "pyyaml",
    "python-dotenv",
    "sentence-transformers",
    "rank_bm25",
    "mcp>=2.3,<3",
]

[project.scripts]
edge-deploy-mcp = "edge_deploy_agent.mcp_server:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
